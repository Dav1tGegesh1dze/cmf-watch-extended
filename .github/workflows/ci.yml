name: Build and test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'feature/**', 'fix/**', 'refactor/**', 'research/**', 'chore/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmf-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  configuration:
    name: CMF Gradle configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: zulu
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0; includes wrapper validation
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Validate Gradle configuration
        run: ./gradlew help :shared:tasks --all --max-workers=2 --stacktrace
      - name: Test offline font audit with synthetic fixtures
        run: python3 -m unittest discover -s tools/font_audit -v
      - name: Test notification font evidence bounds
        run: python3 -m unittest discover -s tools/notification_font -v
      - name: Build and verify Georgian font prototype
        run: |
          npm ci --prefix tools/georgian_font --ignore-scripts --no-audit --no-fund
          python3 -m unittest discover -s tools/georgian_font -v
          python3 tools/georgian_font/build.py
      - name: Save standalone Georgian font prototype
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: georgian-font-prototype
          path: |
            build/georgian-font/georgian*.font
            build/georgian-font/preview*.png
            build/georgian-font/manifest.json
            build/georgian-font/OFL.txt
          retention-days: 7

  android:
    name: CMF Android and shared tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: zulu
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Install Android SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0"'
      - name: Compile shared code, assemble Android and run host tests
        run: ./gradlew :shared:compileCommonMainKotlinMetadata :shared:compileAndroidMain :shared:testAndroidHostTest :androidApp:assembleDebug :androidApp:lintDebug --max-workers=2 --stacktrace
      - name: Save test and lint reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-test-reports
          path: |
            shared/build/reports/tests/
            shared/build/test-results/
            androidApp/build/reports/lint-results-*
          retention-days: 7

  ios:
    name: CMF iOS build and shared tests
    runs-on: macos-26
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: zulu
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Check Apple toolchain
        run: |
          test "$(uname -m)" = arm64
          xcodebuild -version
      - name: Link device and simulator frameworks and run shared tests
        run: ./gradlew :shared:linkDebugFrameworkIosArm64 :shared:linkDebugFrameworkIosSimulatorArm64 :shared:iosSimulatorArm64Test --max-workers=2 --stacktrace
      - name: Build iOS simulator application without signing
        run: xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/ios-ci CODE_SIGNING_ALLOWED=NO build
      - name: Save iOS test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-test-reports
          path: |
            shared/build/reports/tests/
            shared/build/test-results/
          retention-days: 7
